spring.application.name=smart-ticket-router-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/smart_ticket_router
spring.datasource.username=aryadeepvarshney22
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=smart-ticket-router-development-secret-key-2026
jwt.expiration=86400000
ai.service.url=http://localhost:8001

logging.level.org.springframework.security=INFO
# Google OAuth2
# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Email / SMTP
# Email / SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

mail.from=${MAIL_USERNAME:}
frontend.url=${FRONTEND_URL:http://localhost:5173}