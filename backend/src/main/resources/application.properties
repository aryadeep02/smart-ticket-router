spring.application.name=smart-ticket-router-backend

# ==================== DATABASE ====================

spring.datasource.url=jdbc:postgresql://localhost:5432/smart_ticket_router
spring.datasource.username=aryadeepvarshney22
spring.datasource.password=

# Hibernate validates the schema.
# Flyway is responsible for schema changes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==================== FLYWAY ====================

spring.flyway.enabled=true

# Existing database is already populated.
# Establish Flyway baseline for the existing schema.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


# ==================== JWT ====================

jwt.secret=smart-ticket-router-development-secret-key-2026
jwt.expiration=86400000


# ==================== AI SERVICE ====================

ai.service.url=${AI_SERVICE_URL:http://localhost:8001}


# ==================== LOGGING ====================

logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.security.web.authentication=DEBUG


# ==================== GOOGLE OAUTH2 ====================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}


# ==================== EMAIL / SMTP ====================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:aryadeepvarshney85@gmail.com}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ==================== FRONTEND ====================

frontend.url=${FRONTEND_URL:http://localhost:5173}